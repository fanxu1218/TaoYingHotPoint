name: 每日采集热点

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；01:15 对应北京时间 09:15。
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-hot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装采集依赖
        run: pip install -r requirements.txt

      - name: 验证采集器
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: 采集并写入数据库
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python -m collector.main --limit 100 --strict --optional-source xiaohongshu | tee collection-status.json

      - name: 写入任务摘要和平台故障提示
        if: always()
        run: python -m collector.report

  schedule-maintenance:
    name: 维护定时采集
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 仅维护作业可以写仓库；采集作业继续保持只读权限。
    permissions:
      contents: write
    steps:
      - name: 获取主分支最新代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 仅在连续 30 天无提交时写入维护记录
        run: |
          python -m collector.keepalive
          if [ -f .github/schedule-heartbeat.json ]; then
            git add -- .github/schedule-heartbeat.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh scheduled collector heartbeat'
              git push origin HEAD:main
            fi
          fi
